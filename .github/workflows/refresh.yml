name: FMCSA refresh

# Runs WEEKLY but does nothing unless FMCSA actually published a new vintage.
# FMCSA drops the SMS extract roughly monthly on no fixed day, so a monthly cron
# would either miss it or run on stale data. Checking cheaply and skipping is
# more robust than guessing the date — and it avoids burning ~2.5h of runner
# time and ZenRows credits on a no-op.
on:
  schedule:
    - cron: "0 9 * * 1" # Mondays 09:00 UTC
  workflow_dispatch:
    inputs:
      tag:
        description: "Force a vintage tag (YYYYMMDD). Leave blank to auto-detect."
        required: false
      force:
        description: "Run even if the vintage hasn't changed"
        type: boolean
        default: false
      attempt:
        description: "Continuation counter — set automatically when a run resumes a partial scrape. Leave blank."
        required: false

# contents: write to commit refreshed artifacts; actions: write so a run that
# runs out of time can dispatch its own continuation.
permissions:
  contents: write
  actions: write

concurrency:
  # Never let two refreshes overlap: they write the same parquets and would
  # interleave into a mixed vintage.
  group: fmcsa-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    # GitHub-hosted runners hard-cap a job at 6h (360 min) — this cannot be
    # raised. A full refresh does NOT fit: run 32500378060 was killed at 330 min
    # with the crash-indicator scrape only 38% done. That is why the scrape now
    # works to a deadline and the run continues itself; see SCRAPE_DEADLINE_EPOCH.
    timeout-minutes: 350

    steps:
      - uses: actions/checkout@v4
        with:
          # We commit the rebuilt parquets, so we need a writable checkout.
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 1

      - name: Detect FMCSA vintage
        id: vintage
        run: |
          set -euo pipefail
          # Socrata exposes rowsUpdatedAt on the dataset metadata, so we learn the
          # vintage without downloading 9GB first. Keyed on the SMS crash extract;
          # the SMS feeds are published together.
          UPDATED=$(curl -sf --max-time 60 https://data.transportation.gov/api/views/4wxs-vbns.json \
            | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const j=JSON.parse(s);
                const t=j.rowsUpdatedAt||j.dataUpdatedAt;
                console.log(new Date(t*1000).toISOString().slice(0,10).replace(/-/g,''));})")
          FORCED="${{ github.event.inputs.tag }}"
          TAG="${FORCED:-$UPDATED}"
          CURRENT=$(node -e "console.log(require('./data/refresh_metrics.json').snapshot_date||'')")
          echo "detected=$UPDATED current=$CURRENT using=$TAG"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          if [[ "$TAG" == "$CURRENT" && "${{ github.event.inputs.force }}" != "true" ]]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "::notice::FMCSA vintage $TAG already shipped — nothing to do."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Free runner disk
        if: steps.vintage.outputs.changed == 'true'
        run: |
          # The download alone is ~9GB and a stock runner has ~14GB free. Drop
          # preinstalled toolchains we don't use rather than fail 40 minutes in.
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" || true
          df -h / | tail -1

      - uses: pnpm/action-setup@v4
        if: steps.vintage.outputs.changed == 'true'
        with: { version: 10 }

      - uses: actions/setup-node@v4
        if: steps.vintage.outputs.changed == 'true'
        with:
          node-version: 20
          cache: pnpm

      - name: Install uv
        if: steps.vintage.outputs.changed == 'true'
        uses: astral-sh/setup-uv@v5

      - name: Install deps
        if: steps.vintage.outputs.changed == 'true'
        run: pnpm install --frozen-lockfile

      - name: Set the shared scrape deadline
        if: steps.vintage.outputs.changed == 'true'
        run: |
          set -euo pipefail
          # ONE absolute instant, shared by both scrape steps. A per-step budget
          # would hand the full allowance to each of them and overrun the job cap.
          # 290 min from now, inside a 350-min job: leaves ~60 min for the tail of
          # the build, the commit and the push after the scrape stops.
          echo "SCRAPE_DEADLINE_EPOCH=$(( $(date +%s) + 290*60 ))" >> "$GITHUB_ENV"
          echo "Scrape deadline: $(date -u -d "@$(( $(date +%s) + 290*60 ))" '+%H:%M:%SZ')"

      - name: Refresh (download → build → scrape → validate → report)
        id: refresh
        if: steps.vintage.outputs.changed == 'true'
        env:
          ZENROWS_API_KEY: ${{ secrets.ZENROWS_API_KEY }}
          FMCSA_WEBKEY: ${{ secrets.FMCSA_WEBKEY }}
          BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
          # Optional — the download falls back to anonymous, which Socrata
          # throttles harder on multi-GB exports. There is no .env.local on a
          # runner, so these MUST come through the environment.
          SOCRATA_API_KEY: ${{ secrets.SOCRATA_API_KEY }}
          SOCRATA_API_SECRET: ${{ secrets.SOCRATA_API_SECRET }}
        run: |
          set +e
          pnpm refresh "${{ steps.vintage.outputs.tag }}"
          rc=$?
          set -e
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          # 75 = "scrape hit the deadline, progress is saved, resume me". Not a
          # failure: we still want the commit below to bank the partial scrape.
          if [[ $rc -eq 75 ]]; then
            echo "partial=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Scrape hit its time budget — banking progress and continuing in a follow-up run."
            exit 0
          fi
          exit $rc

      - name: Preserve the built artifacts when the run fails
        # MUST run before "Commit refreshed artifacts". That step does
        # `git checkout -- .` to stop a half-built parquet reaching main, which
        # reverts data/carrier_aggregates.parquet to the committed vintage. When
        # this step sat after it (as originally written in #77) the upload
        # succeeded and shipped the WRONG FILE: run 32754995868 produced an
        # artifact whose refresh_metrics.json read snapshot_date=20260812, the
        # vintage we already had. A green check on an upload step says a file
        # was uploaded, not that it was the file you meant.
        #
        # A failed run is the only time these are interesting, and it used to be
        # the only time we discarded them. Uploaded, not committed: unlike the
        # scrape cache this is a REJECTED build with no business on main.
        if: always() && steps.vintage.outputs.changed == 'true' && steps.refresh.outcome != 'success'
        uses: actions/upload-artifact@v4
        with:
          name: failed-build-${{ steps.vintage.outputs.tag }}
          # A build is only diagnosable as a SET. The parquet alone is not
          # enough: the run also regenerates national thresholds and the
          # zip/insurer lookup tables, and pairing a new parquet with the
          # previously-committed thresholds produces verdicts that match neither
          # vintage. That mismatch cost a wrong conclusion once already —
          # replaying 20260813's parquet against old thresholds showed a fixture
          # failure that says nothing about either build on its own.
          path: |
            data/carrier_aggregates.parquet
            data/carrier_risk_signals.parquet
            data/refresh_metrics.json
            data/national_thresholds.json
            data/national_thresholds_v2.json
            data/refresh_reports/
            lib/data/zip-risk.json
            lib/data/insurer-risk.json
            lib/data/lane-liability.json
          retention-days: 14
          if-no-files-found: warn

      - name: Commit refreshed artifacts
        # always(): a CRASH must still bank the scrape. Without this the step is
        # skipped on any non-zero exit — which is what happened to run
        # 32495277181 — and hours of scraping die with the runner. The scrape
        # parquet's own CHECKPOINT_EVERY only helps WITHIN a job; the runner disk
        # is ephemeral, so durability means a commit or nothing.
        if: always() && steps.vintage.outputs.changed == 'true'
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          CRASHED=""
          if [[ "${{ steps.refresh.outcome }}" != "success" ]]; then
            CRASHED="true"
          fi

          if [[ -n "$CRASHED" ]]; then
            # Same scoping rule as the partial path, and for the same reason: the
            # app parquet may be half-rewritten. Bank the scrape, nothing else.
            # No continuation is dispatched — a crash wants a human, not a retry
            # loop. The next run (manual or the weekly cron) resumes from here.
            git add data/fmcsa_scrape
            git checkout -- . 2>/dev/null || true
            if git diff --cached --quiet; then
              echo "::notice::Run failed with no new scrape progress to bank."
              exit 0
            fi
            git commit -m "data: bank partial scrape after a failed refresh ${{ steps.vintage.outputs.tag }}

          The refresh step exited non-zero. This commit preserves the DOTs already
          scraped so the next run resumes instead of restarting. Nothing here is
          validated or promoted."
            for attempt in 1 2 3; do
              git push && break
              git fetch --deepen=50 origin main || git fetch origin main
              git rebase origin/main || { git rebase --abort || true; break; }
            done
            echo "::notice::Banked partial scrape progress from a failed run."
            exit 0
          fi

          if [[ "${{ steps.refresh.outputs.partial }}" == "true" ]]; then
            # ONLY the scrape cache. By the time the scrape runs, steps 2-9 have
            # already rewritten data/carrier_aggregates.parquet — a `git add -A`
            # here would put a partially-built, UNVALIDATED app parquet on main,
            # where a git-integration deploy could pick it up. The scrape parquets
            # are the expensive thing and the only thing worth banking; everything
            # else is rebuilt from scratch by the continuation run anyway.
            git add data/fmcsa_scrape
            git checkout -- . 2>/dev/null || true
            git clean -fd data/refresh_reports 2>/dev/null || true
          else
            git add -A
          fi

          if git diff --cached --quiet; then
            echo "::warning::Refresh produced no file changes — unexpected for a new vintage."
            exit 0
          fi

          if [[ "${{ steps.refresh.outputs.partial }}" == "true" ]]; then
            # THE POINT OF ALL THIS: bank the scrape. Every DOT already fetched
            # lives in data/fmcsa_scrape/*.parquet, and the next run reads it back
            # and scrapes only the remainder. Without this commit the runner is
            # torn down and hours of scraping are simply lost — which is exactly
            # what happened to run 32500378060.
            MSG="data: FMCSA refresh ${{ steps.vintage.outputs.tag }} — partial scrape (automated)

          Scrape hit its wall-clock budget. This commit banks the DOTs fetched so
          far so a continuation run resumes instead of restarting. NOT validated
          and NOT promoted: the parquet here is built from a partial scrape."
          else
            MSG="data: FMCSA refresh ${{ steps.vintage.outputs.tag }} (automated)

          Ran by .github/workflows/refresh.yml. Validation passed (check:parquet,
          rules, snapshots) and drift stayed within tolerance, or this commit
          would not exist — refresh.sh exits non-zero otherwise.

          Report: data/refresh_reports/refresh_${{ steps.vintage.outputs.tag }}.md"
          fi
          git commit -m "$MSG"

          # A run can last 5+ hours, so main may well have moved under us — and a
          # bare push would throw away the whole run at the finish line. Retry by
          # rebasing. The checkout is shallow (10 GB of history; fetch-depth 0 is
          # not an option), so deepen first or there is no common ancestor.
          for attempt in 1 2 3; do
            if git push; then exit 0; fi
            echo "push rejected (attempt $attempt) — deepening and rebasing onto origin/main"
            git fetch --deepen=50 origin main || git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort || true
              echo "::error::Rebase onto origin/main conflicted — refusing to force. Resolve by hand."
              exit 1
            fi
          done
          echo "::error::Could not push after 3 rebase attempts."
          exit 1

      - name: Continue in a follow-up run
        if: steps.vintage.outputs.changed == 'true' && steps.refresh.outputs.partial == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          ATTEMPT="${{ github.event.inputs.attempt }}"
          ATTEMPT="${ATTEMPT:-1}"
          NEXT=$(( ATTEMPT + 1 ))
          # Bound the chain. If the scrape genuinely cannot finish in 6 attempts
          # (~29h of budget) something is wrong and looping forever would just
          # burn runner time and ZenRows credits while hiding it.
          if (( NEXT > 6 )); then
            echo "::error::Scrape still incomplete after $ATTEMPT attempts — stopping the chain. Investigate before re-running."
            exit 1
          fi
          echo "::notice::Dispatching continuation $NEXT/6 for vintage ${{ steps.vintage.outputs.tag }}."
          # Pin the tag: the continuation must extend THIS vintage's scrape, not
          # re-detect and possibly start a different one mid-chain. force=true
          # because refresh_metrics.json may already name this tag.
          gh workflow run refresh.yml --ref main \
            -f tag="${{ steps.vintage.outputs.tag }}" \
            -f force=true \
            -f attempt="$NEXT"

      - name: Promote to production
        if: steps.vintage.outputs.changed == 'true' && steps.refresh.outputs.partial != 'true'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
        run: |
          # promote.sh refuses on a dirty tree, which is why the commit above runs
          # first. It also resolves the Blob token BEFORE deploying, so a missing
          # token cannot leave production split across two vintages.
          pnpm promote

      - name: Publish the run report
        if: steps.vintage.outputs.changed == 'true' && always()
        run: |
          REPORT="data/refresh_reports/refresh_${{ steps.vintage.outputs.tag }}.md"
          if [[ -f "$REPORT" ]]; then
            { echo "## FMCSA refresh ${{ steps.vintage.outputs.tag }}"; echo; cat "$REPORT"; } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No report at $REPORT" >> "$GITHUB_STEP_SUMMARY"
          fi
