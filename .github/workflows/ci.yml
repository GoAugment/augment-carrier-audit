name: CI

# The repo had NO pull-request CI at all. That is how an unvalidated parquet
# reached main in #80 and was auto-deployed to production for ~2 minutes: nothing
# looked at the diff before it merged.
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  # A force-push or a quick follow-up commit should cancel the older check.
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with: { version: 10 }

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          # cache: pnpm  <- TEMPORARILY DISABLED: testing whether a restored
          # pnpm store explains 26 fixture failures that reproduce ONLY on a
          # GitHub runner (clean in a node:20 container with a fresh install).

      - uses: astral-sh/setup-uv@v5

      - run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Committed parquet matches committed metrics
        # The specific guard for the #80 incident. Cheap, and it runs before the
        # merge that would deploy rather than after it.
        run: uv run pipeline/fmcsa-aggregate/check_committed_data.py

      - name: TEMPORARY env-parity diagnostic
        run: |
          node scripts/debug_env_parity.mjs
          echo "--- dependency provenance ---"
          node -e "console.log('duckdb', require('duckdb/package.json').version)"
          node -e "try{require('duckdb');console.log('duckdb native binding: OK')}catch(e){console.log('duckdb load FAILED:',e.message)}"
          node -e "console.log('tsx', require('tsx/package.json').version)"
          pnpm ls --depth 0 2>/dev/null | head -25

      - name: App contract + rules + snapshots
        env:
          # Identity signals degrade gracefully without this, but the fixtures
          # that depend on them would then pass for the wrong reason.
          BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
          FMCSA_WEBKEY: ${{ secrets.FMCSA_WEBKEY }}
        run: pnpm test
