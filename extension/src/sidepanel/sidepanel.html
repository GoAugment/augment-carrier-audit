<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="sidepanel.css" />
    <title>Carrier Check</title>
  </head>
  <body>
    <header id="brandbar">
      <img class="brand-logo" src="../icons/icon32.png" alt="" aria-hidden="true" />
      <span class="brand-name">Augie Carrier Check</span>
      <button id="closeBtn" class="icon-btn" type="button" title="Close" aria-label="Close">✕</button>
    </header>

    <div id="subbar">
      <span class="live-dot" aria-hidden="true"></span>
      <span class="subbar-title">Carrier Check</span>
      <button id="recheck" class="icon-btn" type="button" title="Re-check this page" aria-label="Re-check">↻</button>
      <button id="authChip" class="chip" type="button" title=""></button>
    </div>

    <div id="meta" class="meta"></div>

    <main id="content">
      <div id="status" class="status">Open a load, email, or carrier page and click re-check.</div>
      <section id="verdict" class="verdict" hidden></section>
      <section id="enrichment" class="enrichment" hidden></section>
      <section id="checks" class="checks" hidden></section>
      <section id="basics" class="basics" hidden></section>
    </main>

    <script type="module" src="sidepanel.js"></script>
  </body>
</html>
