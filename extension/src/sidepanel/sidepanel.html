<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="sidepanel.css" />
    <title>Carrier Check</title>
  </head>
  <body>
    <!-- No brand bar here: Chrome's side-panel chrome already shows the
         extension name + close. We start at the green status pill. -->
    <div id="subbar">
      <span class="live-dot" aria-hidden="true"></span>
      <span class="subbar-title">Carrier Check</span>
      <button id="recheck" class="icon-btn" type="button" title="Re-check this page" aria-label="Re-check">↻</button>
      <button id="authChip" class="chip" type="button" title=""></button>
    </div>

    <!-- Dev-only (unpacked install): switch the enrichment environment + brokerage. -->
    <div id="devbar" hidden>
      <span class="dev-tag">DEV</span>
      <button id="envToggle" class="dev-btn" type="button" title="Toggle enrichment environment"></button>
      <input id="brokerageInput" class="dev-input" type="text" spellcheck="false"
        placeholder="brokerageKey (optional)" aria-label="brokerageKey override" />
    </div>

    <div id="meta" class="meta"></div>

    <main id="content">
      <div id="status" class="status">Open a load, email, or carrier page and click re-check.</div>
      <section id="verdict" class="verdict" hidden></section>
      <section id="enrichment" class="enrichment" hidden></section>
      <section id="checks" class="checks" hidden></section>
      <section id="basics" class="basics" hidden></section>
    </main>

    <script type="module" src="sidepanel.js"></script>
  </body>
</html>
